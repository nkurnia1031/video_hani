name: Raka rig browser audit

on:
  push:
    paths:
      - "storyboard/rigs/**"
      - ".github/workflows/raka-rig-audit.yml"
  pull_request:
    paths:
      - "storyboard/rigs/**"
      - ".github/workflows/raka-rig-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    name: Chromium interaction and visual evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: storyboard/rigs/audit/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        working-directory: storyboard/rigs/audit
        run: npm ci

      - name: Install Chromium and system libraries
        working-directory: storyboard/rigs/audit
        run: npx playwright install --with-deps chromium

      - name: Install image-sheet dependency
        run: python -m pip install Pillow

      - name: Run interactive browser audit
        working-directory: storyboard/rigs/audit
        run: npm run audit

      - name: Upload browser screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raka-rig-audit-${{ github.run_id }}
          path: storyboard/rigs/audit/evidence/
          if-no-files-found: warn
          retention-days: 14
