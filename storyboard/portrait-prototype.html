<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portrait storyboard prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#261a2a;color:#fff6ec;font:15px/1.45 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:24px 24px 88px}.wrap{width:min(100%,430px)}.note{margin:0 0 12px;color:#ffc4a3;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.title{margin:0 0 14px;font-size:22px}.frame{width:100%;aspect-ratio:9/16;background:#fff6ec;border-radius:22px;overflow:hidden;box-shadow:0 18px 55px #0008}.frame img{display:block;width:100%;height:100%}.switch{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:10px 14px;background:#fff6ec;color:#2a1f2d;border-radius:999px;box-shadow:0 8px 28px #0007}.switch button{border:0;border-radius:50%;width:36px;height:36px;background:#3d2645;color:#fff6ec;font-size:20px;cursor:pointer}.switch strong{min-width:180px;text-align:center;font-size:13px}</style><main class="wrap"><p class="note">Prototype · 9:16 · Scene 4B</p><h1 class="title">Three portrait compositions</h1><div class="frame"><img id="art" alt="Scene 4B portrait composition"></div></main><nav class="switch" aria-label="Prototype variants"><button id="prev" aria-label="Previous variant">‹</button><strong id="label"></strong><button id="next" aria-label="Next variant">›</button></nav><script>const variants=[['A','Dialogue First'],['B','Scene First'],['C','Conversation Column']];let i=Math.max(0,variants.findIndex(x=>x[0]===new URLSearchParams(location.search).get('variant')));function show(){const [key,name]=variants[i];document.getElementById('art').src=`portrait-prototype-${key}.svg`;document.getElementById('label').textContent=`${key} · ${name}`;const u=new URL(location);u.searchParams.set('variant',key);history.replaceState({},'',u)}function step(d){i=(i+d+variants.length)%variants.length;show()}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);onkeydown=e=>{if(e.target.matches('input,textarea,[contenteditable=true]'))return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)};show();</script></html>
