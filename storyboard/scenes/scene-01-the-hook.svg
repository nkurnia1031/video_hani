<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="frame-title frame-desc" data-frame="01">
  <title id="frame-title">Scene 1 · The Hook</title>
  <desc id="frame-desc">One continuous plum-background scene. The woman from the Character object in People Creating Robot · Rafiki is isolated in a centered half-body crop; its robot, props, panels, and background are omitted. Four public-comment cards with pseudonyms appear at the sides.</desc>
  <metadata>Scene 1 is one continuous editable composition. Presenter: the Character object from People Creating Robot · Rafiki (Storyset, free with attribution). Within that 41-drawable object, six lower-body paths are cropped and six outfit paths recolored; 29/41 (70.7%) remain unchanged. All other source objects are omitted. There is no presenter frame or pointer; comment cards use pseudonyms and generic avatars. Public quote sources, access dates, and Storyset attribution are recorded outside this artwork in the storyboard source audit.</metadata>
