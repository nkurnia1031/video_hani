  <title id="frame-title">4C · Stigma spreads through a post</title>
  <desc id="frame-desc">Raka sits alone at his laptop, looking at the screen with a cold, serious expression as he types a warning about Dina. A zoomed view of the laptop post expands into a chain of notifications.</desc>
  <metadata>Student Stress · Rafiki supplies the laptop and desk; the Co-workers · Rafiki Raka from 4B is reused in a typing pose. Within the 54-drawable Co-workers Raka object, 11 elements change or are omitted (20.4%): nine arm paths repositioned, the handheld phone omitted, and the same mouth adjustment as 4B; 43/54 (79.6%) remain unchanged. The laptop post and notification chain are separate editable vector layers. No character art was generated.</metadata>
