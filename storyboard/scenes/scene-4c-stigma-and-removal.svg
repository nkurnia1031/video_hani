<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="frame-title frame-desc" data-frame="4C">
  <title id="frame-title">4C · Stigma spreads through a post</title>
  <desc id="frame-desc">Raka sits alone at his laptop, looking at the screen with a cold, serious expression as he types a warning about Dina. A zoomed view of the laptop post expands into a chain of notifications.</desc>
  <metadata>Storyset Student Stress · Rafiki. The same source figure and named editable puppet groups are used as in 4A. In the 38-path Character object, seven arm paths are repositioned and five facial paths are adjusted (12/38 = 31.6%); the other 26 paths remain unchanged. Two small eye overlays and the laptop post are separate editable layers. The original desk and laptop stay in their source orientation; background clutter and the source bubble are left out of this composition. The post and notification chain are separate, editable vector layers. Bone-rig software is unavailable here; the SVG group pivots are the production alternative.</metadata>
